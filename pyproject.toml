[project]
name = "ai-engineer-roadmap"
version = "0.1.0"
description = "12-week AI Engineer roadmap: daily lessons, challenges and reference solutions"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.11",
    "openai>=3.22",
    "python-dotenv>=1.2",
    "pydantic>=2.13",
    "tiktoken>=0.14",
    "regex>=2024.1",  # the Unicode-aware patterns of the Week 9 BPE tokenizer (tiktoken depends on it too)
    "numpy>=2.5",
    "matplotlib>=3.11",
    "rich>=15.0",
    "pypdf>=6.0",
    "reportlab>=5.0",
]

[project.optional-dependencies]
# Local open-weights models on CPU/GPU (Week 1 days 2-4, Week 9, Week 10)
local = [
    "torch>=2.14",
    "transformers>=5.18",
]

# Retrieval stack (Weeks 3-4, 11)
rag = [
    "torch>=2.14",
    "transformers>=5.18",
    "chromadb>=1.5",
    "qdrant-client>=1.19",
    "hnswlib>=0.8",
    "rank-bm25>=0.2",
    "psycopg[binary]>=3.3",
    "pgvector>=0.5",
    "pdfplumber>=0.11",
    "sqlglot>=30",
    "networkx>=3.4",
    "scipy>=1.15",
]
# Agents (Week 5): MCP SDK (2.x installs as `mcp`; pin <2 for the old FastMCP API) and pandas for the analysis agent
agents = [
    "mcp>=2",
    "pandas>=3",
    # Week 6 frameworks (versions used while writing: langgraph 1.2, openai-agents 0.22, pydantic-ai 2.52)
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3",
    "openai-agents>=0.22",
    "pydantic-ai-slim[openai]>=2.5",
    "claude-agent-sdk>=0.2",
    # Week 7 tracing (versions used while writing: opentelemetry 1.45; already installed as a dependency of the above)
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-grpc>=1.30",
]
# Fine-tuning (Week 10): PEFT is used to VERIFY the from-scratch LoRA (the lessons train with their own code; TRL/Unsloth appear only as labelled, unrun sketches)
finetune = [
    "torch>=2.14",
    "transformers>=5.18",
    "peft>=0.21",
    "accelerate>=1.15",
]
# DSPy (Week 2 Day 6). Its litellm dependency pins openai<3; pip warns but it coexists - or use a separate venv.
dspy = ["dspy>=3.4"]

[dependency-groups]
dev = [
    "ruff>=0.15",
    "pytest>=9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Line length is the formatter's job; docstrings and sample output may run long.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Lesson/solution files embed sample output and long prose in docstrings.
"weeks/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
